<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Дуу Орчуулагч</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<style>
:root{
  --bg:#0b1020;--card:rgba(255,255,255,.055);--card-line:rgba(255,255,255,.09);
  --field:rgba(5,9,22,.55);--text:#eef1fb;--muted:#9aa3c0;
  --a1:#22d3ee;--a2:#8b5cf6;--grad:linear-gradient(135deg,var(--a1),var(--a2));
  --rec1:#fb7185;--rec2:#f43f5e;--err:#fda4af;--ok:#6ee7b7
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;color:var(--text);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(600px 420px at 0% -5%,rgba(34,211,238,.20),transparent 60%),
    radial-gradient(560px 420px at 100% 10%,rgba(139,92,246,.24),transparent 60%),
    radial-gradient(500px 400px at 50% 110%,rgba(56,189,248,.10),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin:6px 2px 18px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px rgba(139,92,246,.35)}
.logo svg{width:24px;height:24px;color:#fff}
h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{margin:0;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:22px;padding:16px;margin-bottom:14px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
label.t{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px}
.gap{margin-top:14px}
textarea,input{width:100%;background:var(--field);color:var(--text);border:1px solid var(--card-line);border-radius:14px;padding:12px 14px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus,input:focus{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
textarea{min-height:96px;resize:vertical}
textarea::placeholder,input::placeholder{color:#6b7493}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;gap:4px;padding:4px;background:var(--field);border:1px solid var(--card-line);border-radius:14px}
.seg button{flex:1;min-width:0;padding:10px 6px;border-radius:10px;background:transparent;color:var(--muted);font-weight:700}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.35)}
button{border:0;font:inherit;font-weight:700;cursor:pointer;color:var(--text);transition:transform .12s,opacity .2s,background .2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 12px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--card-line)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 22px rgba(139,92,246,.35)}
.btn.full{width:100%}
.mic-zone{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px}
#mic{position:relative;width:128px;height:128px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 0 0 10px rgba(139,92,246,.12),0 0 0 22px rgba(34,211,238,.06),0 16px 40px rgba(139,92,246,.45)}
#mic svg{width:48px;height:48px;color:#fff}
#mic .i-stop{display:none}
#mic.rec{background:linear-gradient(135deg,var(--rec1),var(--rec2));box-shadow:0 16px 40px rgba(244,63,94,.45)}
#mic.rec .i-mic{display:none}#mic.rec .i-stop{display:block}
#mic.rec::before,#mic.rec::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(251,113,133,.6);animation:ring 1.6s ease-out infinite}
#mic.rec::after{animation-delay:.8s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.6);opacity:0}}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:26px 0 0}
#status{white-space:pre-wrap;min-height:20px;font-size:13.5px;color:var(--muted);text-align:center;margin:10px 0 14px}
#status.err{color:var(--err);background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.25);border-radius:12px;padding:10px;text-align:left}
#status:empty{margin:6px 0}
.out-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--grad);color:#fff}
.back{font-size:14px;color:var(--muted);margin-top:10px;padding:10px 12px;border-left:3px solid var(--a1);background:rgba(34,211,238,.06);border-radius:0 10px 10px 0;white-space:pre-wrap}
.back:empty{display:none}
audio{width:100%;margin:12px 0;height:44px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .wide{grid-column:1/-1}
details summary{cursor:pointer;color:var(--muted);font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"›";margin-left:auto;font-size:20px;transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
details .f{margin-top:12px}
a{color:var(--a1)}
.small{font-size:12.5px;color:var(--muted);text-align:center;margin:10px 0 0}
.hidden{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">

  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>

  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
</svg>
<div class="wrap">
  <header>
    <div class="logo"><svg><use href="#i-globe"/></svg></div>
    <div><h1>Дуу Орчуулагч</h1><p class="sub">Монголоор ярь — хэлээр нь хүргэе</p></div>
  </header>

  <div class="card">
    <label class="t">Хэл</label>
    <div class="seg" id="langs"></div>
    <div class="row gap">
      <div><label class="t">Хэв маяг</label><div class="seg" id="styles"></div></div>
    </div>
    <div class="gap"><label class="t">Хоолой</label><div class="seg" id="voices"></div></div>
  </div>

  <div class="card">
    <div class="mic-zone">
      <button id="mic" aria-label="Бичих"><svg class="i-mic"><use href="#i-mic"/></svg><svg class="i-stop"><use href="#i-stop"/></svg></button>
      <p class="hint" id="micHint">Дарж ярина, дуусаад дахин дарна</p>
    </div>
    <div id="status"></div>
    <label class="t">Монгол текст</label>
    <textarea id="mn" spellcheck="false" autocorrect="off" autocomplete="off" lang="mn" placeholder="Энд таны хэлсэн үг гарна... Засаж эсвэл шууд бичиж болно"></textarea>
    <button class="btn primary full gap" id="go"><svg><use href="#i-globe"/></svg>Орчуулах + Хоолой болгох</button>
  </div>

  <div class="card hidden" id="out">
    <div class="out-head"><label class="t" style="margin:0">Орчуулга</label><span class="badge" id="outLabel">—</span></div>
    <textarea id="tr" spellcheck="false" autocorrect="off" autocomplete="off"></textarea>
    <div class="back" id="back"></div>
    <audio id="player" controls></audio>
    <div class="actions">
      <button class="btn primary wide" id="shareAudio"><svg><use href="#i-send"/></svg>Аудио илгээх</button>
      <button class="btn" id="shareText"><svg><use href="#i-chat"/></svg>Текст илгээх</button>
      <button class="btn" id="copy"><svg><use href="#i-copy"/></svg>Хуулах</button>
      <button class="btn wide" id="retts"><svg><use href="#i-redo"/></svg>Засварласан текстээр дахин хоолой</button>
    </div>
  </div>

  <div class="card">
    <details id="settings">
      <summary><svg style="width:18px;height:18px"><use href="#i-gear"/></svg>Тохиргоо</summary>
      <div class="f">
        <label class="t">Gemini API түлхүүр · <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">энд авна</a></label>
        <input id="key" type="password" placeholder="AIza..." autocomplete="off">
      </div>
      <div class="f row">
        <div><label class="t">Текстийн модель</label><input id="mText"></div>
        <div><label class="t">Хоолойн модель</label><input id="mTts"></div>
      </div>
      <button class="btn primary full f" id="save">Хадгалах</button>
      <p class="small">Түлхүүр зөвхөн энэ утсан дээр хадгалагдана. Модель ажиллахгүй бол апп өөрөө дараагийнх руу шилжинэ.</p>
    </details>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};

const LANGS = {
  zh: { btn: "中文", mn: "Хятад", en: "Simplified Chinese (Mandarin, mainland China usage)" },
  ru: { btn: "Русский", mn: "Орос", en: "Russian" },
  en: { btn: "English", mn: "Англи", en: "English" }
};
const STYLES = {
  biz: { btn: "Ажил хэрэг", en: "polite, clear, professional business tone suitable for suppliers, partners and technical support" },
  casual: { btn: "Энгийн", en: "friendly, natural everyday conversational tone" }
};
const VOICES = { f: { btn: "Эмэгтэй", name: "Kore" }, m: { btn: "Эрэгтэй", name: "Charon" } };

const S = {
  lang: store.get("lang", "zh"),
  style: store.get("style", "biz"),
  voice: store.get("voice", "m"),
  key: store.get("key", ""),
  mText: store.get("mText", "gemini-3.8-flash"),
  mTts: store.get("mTts", "gemini-3.8-flash-tts")
};

function seg(boxId, items, field){
  const box = $(boxId); box.innerHTML = "";
  for (const [k, v] of Object.entries(items)){
    const b = document.createElement("button");
    b.textContent = v.btn; b.className = S[field] === k ? "on" : "";
    b.onclick = () => { S[field] = k; store.set(field, k); seg(boxId, items, field); };
    box.appendChild(b);
  }
}
seg("langs", LANGS, "lang"); seg("styles", STYLES, "style"); seg("voices", VOICES, "voice");

$("key").value = S.key; $("mText").value = S.mText; $("mTts").value = S.mTts;
if (!S.key) $("settings").open = true;
$("save").onclick = () => {
  S.key = $("key").value.trim(); S.mText = $("mText").value.trim() || "gemini-3.8-flash"; S.mTts = $("mTts").value.trim() || "gemini-3.8-flash-tts";
  store.set("key", S.key); store.set("mText", S.mText); store.set("mTts", S.mTts);
  $("settings").open = false; status("Хадгаллаа ✓");
};

function status(msg, err){ const s = $("status"); s.textContent = msg || ""; s.className = err ? "err" : ""; }

// ---------- Gemini ----------
const TEXT_MODELS = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"];
const TTS_MODELS = ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-3.1-flash-tts-preview"];
const good = {};
async function geminiAuto(kind, body){
  const pref = kind === "tts" ? S.mTts : S.mText;
  const list = [...new Set([good[kind], pref, ...(kind === "tts" ? TTS_MODELS : TEXT_MODELS)].filter(Boolean))];
  const errs = [];
  for (const m of list){
    try {
      const out = await gemini(m, body);
      good[kind] = m;
      return out;
    } catch (e) {
      errs.push(e.message);
      if (/API key|API_KEY|PERMISSION_DENIED|Эхлээд Тохиргоо/i.test(e.message)) throw e;
    }
  }
  throw new Error("Бүх модель амжилтгүй:\n" + errs.join("\n"));
}

async function gemini(model, body){
  if (!S.key) { $("settings").open = true; throw new Error("Эхлээд Тохиргоо дээр API түлхүүрээ оруулна уу"); }
  const ac = new AbortController();
  const base = $("status").textContent.replace(/ \[.*$/, "");
  let sec = 0;
  const tick = setInterval(() => { sec++; $("status").textContent = `${base} [${model}, ${sec} сек]`; }, 1000);
  const to = setTimeout(() => ac.abort(), 40000);
  let r;
  try {
    r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": S.key },
      body: JSON.stringify(body),
      signal: ac.signal
    });
  } catch (e) {
    throw new Error(e.name === "AbortError" ? `40 секунд хүлээгээд хариу ирсэнгүй (модель: ${model})` : "Сүлжээний алдаа: " + e.message);
  } finally { clearInterval(tick); clearTimeout(to); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`[${model}] ` + ((j.error && j.error.message) || ("HTTP " + r.status)));
  const parts = j.candidates?.[0]?.content?.parts || [];
  if (!parts.length) throw new Error("Хоосон хариу ирлээ");
  return parts;
}
const textOf = parts => parts.map(p => p.text || "").join("").trim();

const CONTEXT = "Context: the speaker is a Mongolian man working at a metal fabrication company (CNC laser cutting, laser welding, press brake bending, vehicle roof racks and off-road accessories). He often talks with Chinese machine suppliers, technical support staff and partners.";

async function transcribe(wavB64){
  const parts = await geminiAuto("text", {
    contents: [{ parts: [
      { inlineData: { mimeType: "audio/wav", data: wavB64 } },
      { text: "Transcribe this Mongolian speech exactly as spoken, in Mongolian Cyrillic script, with correct punctuation. " + CONTEXT + " Output only the transcription, nothing else. If there is no speech, output an empty string." }
    ]}]
  });
  return textOf(parts);
}

async function translate(mn){
  const L = LANGS[S.lang], St = STYLES[S.style];
  const prompt = `${CONTEXT}
Task: The following Mongolian text was produced by speech recognition and may contain small recognition errors; silently fix obvious errors using context. Translate it into ${L.en} in a ${St.en}. Rewrite it so it reads naturally to a native speaker, keep the meaning, keep technical terms, numbers and model names accurate. Do not add new facts.
Also give a short back-translation of your result into Mongolian so the speaker can verify the meaning.
Return JSON: {"translation": "...", "back": "..."}

Mongolian text:
${mn}`;
  const parts = await geminiAuto("text", {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: { responseMimeType: "application/json" }
  });
  const raw = textOf(parts);
  try { const o = JSON.parse(raw); return { tr: (o.translation || "").trim(), back: (o.back || "").trim() }; }
  catch { return { tr: raw, back: "" }; }
}

async function tts(text){
  const parts = await geminiAuto("tts", {
    contents: [{ parts: [{ text }] }],
    generationConfig: {
      responseModalities: ["AUDIO"],
      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: VOICES[S.voice].name } } }
    }
  });
  const p = parts.find(x => x.inlineData && x.inlineData.data);
  if (!p) throw new Error("Хоолой ирсэнгүй");
  const mime = p.inlineData.mimeType || "";
  const rate = parseInt((mime.match(/rate=(\d+)/) || [])[1] || "24000", 10);
  const bytes = b64ToBytes(p.inlineData.data);
  const pcm = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength / 2));
  return { pcm, rate };
}

// ---------- Аудио туслах функцууд ----------
function bytesToB64(buf){
  const u = new Uint8Array(buf); let s = "";
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToBytes(b64){
  const s = atob(b64), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}
function wavFromInt16(pcm, rate){
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return buf;
}
function floatToInt16(f){
  const out = new Int16Array(f.length);
  for (let i = 0; i < f.length; i++){ const x = Math.max(-1, Math.min(1, f[i])); out[i] = x < 0 ? x * 0x8000 : x * 0x7fff; }
  return out;
}
function toMp3(pcm, rate){
  if (!window.lamejs) return null;
  try {
    const enc = new lamejs.Mp3Encoder(1, rate, 64), chunks = [];
    for (let i = 0; i < pcm.length; i += 1152){ const b = enc.encodeBuffer(pcm.subarray(i, i + 1152)); if (b.length) chunks.push(new Uint8Array(b)); }
    const end = enc.flush(); if (end.length) chunks.push(new Uint8Array(end));
    return new Blob(chunks, { type: "audio/mpeg" });
  } catch (e) { console.warn(e); return null; }
}

// ---------- Бичлэг ----------
let rec = null, stream = null, chunks = [], busy = false;
$("mic").onclick = async () => {
  if (busy) return;
  if (rec && rec.state === "recording") { rec.stop(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    const why = {
      NotAllowedError: "Микрофоны зөвшөөрөл хаалттай байна",
      NotReadableError: "Микрофоныг өөр апп (дуудлага, Bluetooth чихэвч г.м.) ашиглаж байна",
      NotFoundError: "Микрофон олдсонгүй",
      SecurityError: "Аюулгүй байдлын хязгаарлалт"
    }[e.name] || "Микрофон нээгдсэнгүй";
    status(`${why} (${e.name}: ${e.message})`, true); return;
  }
  chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = onRecStop;
  rec.start();
  $("mic").classList.add("rec"); $("micHint").textContent = "Сонсож байна... дуусаад дарна";
  status("");
};

async function onRecStop(){
  stream.getTracks().forEach(t => t.stop());
  $("mic").classList.remove("rec"); $("micHint").textContent = "Дарж ярина, дуусаад дахин дарна";
  busy = true;
  try {
    status("⏳ Бичлэгийг бэлдэж байна...");
    const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
    ctx.close();
    if (buf.duration < 0.5) throw new Error("Бичлэг хэтэрхий богино байна");
    const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
    const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
    const res = await off.startRendering();
    const wav = wavFromInt16(floatToInt16(res.getChannelData(0)), 16000);
    status("⏳ Яриаг текст болгож байна...");
    const text = await transcribe(bytesToB64(wav));
    if (!text) throw new Error("Яриа танигдсангүй, дахин оролдоно уу");
    const box = $("mn");
    box.value = box.value.trim() ? box.value.trim() + " " + text : text;
    status("✓ Текстээ шалгаад «Орчуулах» дарна уу");
  } catch (e) { status(e.message, true); }
  busy = false;
}

// ---------- Орчуулах + хоолой ----------
let lastAudio = null;
async function makeVoice(text){
  status("⏳ Хоолой үүсгэж байна...");
  const { pcm, rate } = await tts(text);
  const mp3 = toMp3(pcm, rate);
  const blob = mp3 || new Blob([wavFromInt16(pcm, rate)], { type: "audio/wav" });
  const ext = mp3 ? "mp3" : "wav";
  const stamp = new Date().toISOString().slice(11, 19).replace(/:/g, "");
  lastAudio = new File([blob], `${S.lang}_${stamp}.${ext}`, { type: blob.type });
  const p = $("player"); if (p.src) URL.revokeObjectURL(p.src);
  p.src = URL.createObjectURL(blob);
  status("✓ Бэлэн. Сонсоод илгээнэ үү");
}

$("go").onclick = async () => {
  const mn = $("mn").value.trim();
  if (!mn) { status("Эхлээд ярих эсвэл бичих хэрэгтэй", true); return; }
  if (busy) return; busy = true; $("go").disabled = true;
  try {
    status("⏳ Орчуулж байна...");
    const { tr, back } = await translate(mn);
    $("out").classList.remove("hidden");
    $("outLabel").textContent = LANGS[S.lang].mn;
    $("tr").value = tr;
    $("back").textContent = back ? "Утга нь: " + back : "";
    await makeVoice(tr);
    $("out").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) { status(e.message, true); }
  busy = false; $("go").disabled = false;
};

$("retts").onclick = async () => {
  const t = $("tr").value.trim(); if (!t || busy) return;
  busy = true; try { await makeVoice(t); } catch (e) { status(e.message, true); } busy = false;
};

$("shareAudio").onclick = async () => {
  if (!lastAudio) return;
  try {
    if (navigator.canShare && navigator.canShare({ files: [lastAudio] })) await navigator.share({ files: [lastAudio] });
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(lastAudio); a.download = lastAudio.name; a.click(); status("Хуваалцах боломжгүй тул татаж авлаа"); }
  } catch (e) { if (e.name !== "AbortError") status(e.message, true); }
};
$("shareText").onclick = async () => {
  const t = $("tr").value.trim(); if (!t) return;
  try { if (navigator.share) await navigator.share({ text: t }); else { await navigator.clipboard.writeText(t); status("Хууллаа ✓"); } }
  catch (e) { if (e.name !== "AbortError") status(e.message, true); }
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("tr").value.trim()); status("Хууллаа ✓"); } catch { status("Хуулж чадсангүй", true); }
};
</script>
